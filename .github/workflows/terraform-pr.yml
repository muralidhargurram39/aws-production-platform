name: Terraform PR Validation

on:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  validate:

    name: Validate Terraform

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/dev

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print OIDC Claims
        shell: bash
        run: |
         python3 <<'PY'
         import os, json, urllib.request, base64

         req = urllib.request.Request(
             os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com",
             headers={
            "Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
           }
          )

         response = urllib.request.urlopen(req).read()
         token = json.loads(response)["value"]

         payload = token.split(".")[1]
         payload += "=" * (-len(payload) % 4)

         claims = json.loads(base64.urlsafe_b64decode(payload))

         print(json.dumps(claims, indent=2))
         PY

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::626311400372:role/aws-production-platform-dev-github-actions
          aws-region: ap-south-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: environments/dev
          framework: terraform
          quiet: true

      - name: Terraform Plan
        run: terraform plan -out=tfplan -no-color

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: environments/dev/tfplan

