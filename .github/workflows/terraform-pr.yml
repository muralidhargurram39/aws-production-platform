name: Terraform PR Validation

on:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  validate:

    name: Validate Terraform

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/dev

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Debug GitHub Context
        run: |
          echo "Repository : ${{ github.repository }}"
          echo "Ref        : ${{ github.ref }}"
          echo "Event      : ${{ github.event_name }}"
          echo "Actor      : ${{ github.actor }}"
          echo "Repository Owner : ${{ github.repository_owner }}"
      
      - name: Print GitHub OIDC Claims
        shell: bash
        run: |
         sudo apt-get update -qq
         sudo apt-get install -y jq -qq

         RESPONSE=$(curl -s \
         -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
         "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

         TOKEN=$(echo "$RESPONSE" | jq -r '.value')

         python3 - "$TOKEN" <<'PY'
         import base64
         import json
         import sys

         token = sys.argv[1]
         payload = token.split(".")[1]
         payload += "=" * (-len(payload) % 4)

         claims = json.loads(base64.urlsafe_b64decode(payload))

         print("\n========== OIDC CLAIMS ==========\n")
         for k in [
           "sub",
           "aud",
           "repository",
           "repository_owner",
           "ref",
           "event_name",
           "workflow",
           "job_workflow_ref"
         ]:
         print(f"{k}: {claims.get(k)}")
         PY

      - name: Verify AWS Role ARN Secret
        run: |
         echo "AWS_ROLE_ARN=${{ secrets.AWS_ROLE_ARN }}"

      - name: Debug GitHub OIDC Claims
        uses: github/actions-oidc-debugger@main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: environments/dev
          framework: terraform
          quiet: true

      - name: Terraform Plan
        run: terraform plan -out=tfplan -no-color

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: environments/dev/tfplan
