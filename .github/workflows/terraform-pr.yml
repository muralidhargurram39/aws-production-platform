name: Terraform PR Validation

on:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print GitHub Context
        run: |
          echo "Repository        : ${{ github.repository }}"
          echo "Repository Owner  : ${{ github.repository_owner }}"
          echo "Ref               : ${{ github.ref }}"
          echo "Head Ref          : ${{ github.head_ref }}"
          echo "Base Ref          : ${{ github.base_ref }}"
          echo "Event             : ${{ github.event_name }}"
          echo "Workflow          : ${{ github.workflow }}"
          echo "Actor             : ${{ github.actor }}"

      - name: Print AWS Role ARN Secret
        run: |
          echo "AWS_ROLE_ARN=${{ secrets.AWS_ROLE_ARN }}"

      - name: Print GitHub OIDC Claims
        shell: bash
        run: |
          set -e

          sudo apt-get update -qq
          sudo apt-get install -y jq -qq

          RESPONSE=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          python3 - "$TOKEN" <<'PY'
import base64
import json
import sys

token = sys.argv[1]

payload = token.split(".")[1]
payload += "=" * (-len(payload) % 4)

claims = json.loads(base64.urlsafe_b64decode(payload))

print("\n========== OIDC CLAIMS ==========\n")

keys = [
    "iss",
    "aud",
    "sub",
    "repository",
    "repository_owner",
    "repository_id",
    "ref",
    "ref_type",
    "event_name",
    "workflow",
    "job_workflow_ref",
    "actor",
]

for key in keys:
    print(f"{key:20}: {claims.get(key)}")
PY

      - name: Stop After Debugging
        run: |
          echo "OIDC debugging completed."
          exit 0
